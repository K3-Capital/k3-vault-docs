name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build documentation
        run: npx --yes honkit@6.2.2 build . _book

      # GitBook.com renders ```mermaid fenced blocks natively on its platform, but
      # plain HonKit only emits them as inert code blocks. Replace every Mermaid
      # block in the generated HTML with its rendered <svg> so GitHub Pages shows
      # the diagrams too. The Markdown ```mermaid sources are left untouched, so
      # GitBook keeps rendering them natively.
      - name: Inline Mermaid diagrams as SVG
        run: |
          npm install --no-save @mermaid-js/mermaid-cli@11.17.0
          node scripts/inline-mermaid.mjs

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
